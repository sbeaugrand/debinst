---
- name: /etc/netplan/armbian.yaml
  vars:
    ip:
      nanopi: 192.168.1.14
      orangepizero: 192.168.1.15
      rockpi-s: 192.168.1.18
  blockinfile:
    path: /etc/netplan/armbian.yaml
    create: yes
    block: |
      network:
        version: 2
        ethernets:
          controllerPI:
            match:
              name: end*
            dhcp4: false
            addresses:
              - {{ ip[ansible_facts["hostname"]] }}/24
            routes:
              - to: default
                via: 192.168.1.254
            nameservers:
              addresses:
                - 8.8.8.8
                - 8.8.4.4
    mode: 0600
  notify:
    - netplan generate
  become: yes

- name: remove 10-dhcp-all-interfaces.yaml
  file:
    path: /etc/netplan/10-dhcp-all-interfaces.yaml
    state: absent
  notify:
    - netplan generate
  become: yes
